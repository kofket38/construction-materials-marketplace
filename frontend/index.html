<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Construction Materials Marketplace — compare cement, steel, aggregates and finishes from named suppliers, request quotations, and order for delivery to your site."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>CMM — Construction Materials Marketplace</title>
    <script>
      // Applies the stored theme before first paint so the page never flashes the
      // wrong appearance. Mirrors THEME_STORAGE_KEY, DARK_CLASS_NAME and
      // DEFAULT_THEME_PREFERENCE in src/shared/theme/theme.store.ts — keep the
      // two in step.
      (function () {
        try {
          var stored = window.localStorage.getItem("cmm.theme");
          // Dark is CMM's default appearance, so anything other than an explicit
          // "light" or an OS-following "system" resolves to dark.
          var isDark =
            stored === "light"
              ? false
              : stored === "system"
                ? window.matchMedia("(prefers-color-scheme: dark)").matches
                : true;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (error) {
          // Storage or matchMedia unavailable: fall back to the dark default.
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
